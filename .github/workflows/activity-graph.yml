name: Update activity graph

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_activity_graph.py
      - .github/workflows/activity-graph.yml

permissions:
  contents: write

concurrency:
  group: activity-graph
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_activity_graph.py
      - name: Commit updated graph
        run: |
          git add assets/activity-graph.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update activity graph"
          git pull --rebase origin main
          git push origin HEAD:main
